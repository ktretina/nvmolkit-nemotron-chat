services:
  app:
    image: ghcr.io/ktretina/nvmolkit-nemotron-chat@sha256:278d4dacdedfae6c05d7effb28fa9c1d745262424a88e85696c363e17bba0afe
    environment:
      TRITON_CACHE_DIR: /tmp/triton-cache
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
