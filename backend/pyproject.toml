[project]
name = "nvmolkit-nemotron-chat"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.116.1",
    "openai==1.97.1",
    "pandas==2.3.1",
    "pydantic==2.11.7",
    "rdkit==2026.3.1",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["../tests"]
